<script>
  (() => {
    "use strict";

    const root = document.getElementById("functions-report-96b2fdc277d93df8");
    if (!root) return;

    const modelSource = root.querySelector("[data-report-model]");
    const treeTarget = root.querySelector("[data-report-tree]");
    const copyButton = root.querySelector("[data-copy-annotations]");
    const copyStatus = root.querySelector("[data-copy-status]");
    const form = root.querySelector("[data-annotation-form]");
    const annotationTarget = root.querySelector("[data-annotation-target]");
    const annotationText = root.querySelector("[data-annotation-text]");
    const cancelButton = root.querySelector("[data-annotation-cancel]");
    const saveButton = root.querySelector("[data-annotation-save]");
    if (
      !modelSource ||
      !treeTarget ||
      !copyButton ||
      !copyStatus ||
      !form ||
      !annotationTarget ||
      !annotationText ||
      !cancelButton ||
      !saveButton
    ) {
      return;
    }

    let model;
    try {
      model = JSON.parse(modelSource.textContent || "");
    } catch {
      treeTarget.textContent = "Unable to render the functions outline.";
      treeTarget.setAttribute("role", "alert");
      return;
    }

    const annotations = new Map();
    let activeNode = null;
    let editorNode = null;

    const countLabel = (node) => {
      const count = node.kind === "folder" ? node.fileCount : node.callableCount;
      const noun = node.kind === "folder" ? "file" : "function";
      return `${count} ${noun}${count === 1 ? "" : "s"}`;
    };

    const changeLabel = (node) =>
      `${node.additions} addition${node.additions === 1 ? "" : "s"}, ${node.deletions} deletion${node.deletions === 1 ? "" : "s"}`;

    const nodeLabel = (node) => {
      if (node.kind === "folder") return `Folder ${node.label}, ${countLabel(node)}, ${changeLabel(node)}`;
      if (node.kind === "file") {
        if (node.proposal === "new") {
          return `File ${node.label}, new proposal, ${countLabel(node)}, ${changeLabel(node)}`;
        }
        return `File ${node.label}, ${countLabel(node)}, ${changeLabel(node)}`;
      }
      const proposalLabel = node.proposal === "new" ? ", new proposal" : "";
      return `Callable ${node.signature}${proposalLabel}${node.returns ? `, returns ${node.returns}` : ""}`;
    };

    const setNodeAccessibleLabel = (element) => {
      const label = element.dataset.annotationLabel || "Report node";
      const suffix = annotations.has(element.dataset.nodeId) ? ", annotated" : "";
      element.setAttribute("aria-label", `${label}${suffix}`);
    };

    const setActiveNode = (element) => {
      if (!element || element === activeNode) return;
      if (activeNode) activeNode.removeAttribute("aria-current");
      activeNode = element;
      activeNode.setAttribute("aria-current", "true");
    };

    const addAnnotationMarker = (element) => {
      const marker = document.createElement("span");
      marker.className = "fr-annotation-marker";
      marker.dataset.annotationMarker = "";
      marker.textContent = "Annotated";
      marker.hidden = true;
      element.append(marker);
    };

    const appendTotalCount = (container, node) => {
      const count = document.createElement("span");
      count.className = "fr-total-count";
      count.textContent = String(
        node.kind === "folder" ? node.fileCount : node.callableCount,
      );
      count.setAttribute("aria-hidden", "true");
      container.append(count);
    };

    const appendNewBadge = (container, node) => {
      if (node.proposal !== "new") return;
      const badge = document.createElement("span");
      badge.className = "fr-new-badge";
      badge.textContent = "NEW";
      badge.setAttribute("aria-hidden", "true");
      container.append(badge);
    };

    const appendLanguageAndKindTags = (container, node) => {
      for (const language of node.languages) {
        const tag = document.createElement("span");
        tag.className = "fr-language-tag";
        tag.textContent = language;
        tag.setAttribute("aria-hidden", "true");
        container.append(tag);
      }
      for (const kind of node.itemKinds) {
        const tag = document.createElement("span");
        tag.className = "fr-item-kind-tag";
        tag.textContent = kind;
        tag.setAttribute("aria-hidden", "true");
        container.append(tag);
      }
    };

    const appendNote = (container, detail) => {
      if (!detail?.text) return;
      const note = document.createElement("button");
      note.type = "button";
      note.className = `fr-tree-row fr-node fr-note fr-note-${detail.field}`;
      note.tabIndex = -1;
      note.dataset.nodeId = detail.id;
      note.dataset.annotationLabel = `${detail.label}: ${detail.text}`;
      note.dataset.annotationBreadcrumb = detail.breadcrumb;
      note.setAttribute("aria-keyshortcuts", "Enter");
      const noteContent = document.createElement("span");
      noteContent.className = "fr-note-content";
      if (detail.field !== "description") {
        const noteLabel = document.createElement("span");
        noteLabel.className = "fr-note-label";
        noteLabel.textContent = `${detail.label}: `;
        noteContent.append(noteLabel);
      }
      noteContent.append(document.createTextNode(detail.text));
      note.append(noteContent);
      addAnnotationMarker(note);
      setNodeAccessibleLabel(note);
      container.append(note);
    };

    const syntaxKeywords = new Set([
      "async", "await", "class", "const", "extends", "function", "get",
      "in", "let", "new", "of", "return", "set", "static", "throw",
      "var", "yield",
    ]);
    const syntaxLiterals = new Set(["false", "null", "true", "undefined"]);
    const punctuationCharacters = "()[]{}.,:;=<>+-*/!?|&%";

    const tokenizeSignature = (signature) => {
      const tokens = [];
      let index = 0;
      const appendToken = (start, end, kind) => {
        tokens.push({ text: signature.slice(start, end), start, kind });
      };

      while (index < signature.length) {
        const start = index;
        const character = signature[index];
        if (/\s/u.test(character)) {
          while (index < signature.length && /\s/u.test(signature[index])) index += 1;
          appendToken(start, index, "plain");
          continue;
        }
        if (character === "\"" || character === "'" || character === String.fromCharCode(96)) {
          const quote = character;
          index += 1;
          while (index < signature.length) {
            if (signature[index] === "\\") {
              index = Math.min(signature.length, index + 2);
              continue;
            }
            const current = signature[index];
            index += 1;
            if (current === quote) break;
          }
          appendToken(start, index, "string");
          continue;
        }
        if (/[A-Za-z_$]/u.test(character)) {
          index += 1;
          while (index < signature.length && /[A-Za-z0-9_$]/u.test(signature[index])) index += 1;
          appendToken(start, index, "identifier");
          continue;
        }
        if (/[0-9]/u.test(character)) {
          index += 1;
          while (index < signature.length && /[0-9A-Fa-f_xXobn.]/u.test(signature[index])) index += 1;
          appendToken(start, index, "number");
          continue;
        }
        index += 1;
        appendToken(start, index, punctuationCharacters.includes(character) ? "punctuation" : "plain");
      }

      const openingParenthesis = signature.indexOf("(");
      const closingParenthesis = signature.lastIndexOf(")");
      let nameToken = null;
      for (const token of tokens) {
        if (
          token.kind === "identifier" &&
          (openingParenthesis < 0 || token.start < openingParenthesis) &&
          !syntaxKeywords.has(token.text)
        ) {
          nameToken = token;
        }
      }

      return tokens.map((token) => {
        if (token.kind === "string") return { ...token, className: "fr-syntax-string" };
        if (token.kind === "number") return { ...token, className: "fr-syntax-literal" };
        if (token.kind === "punctuation") return { ...token, className: "fr-syntax-punctuation" };
        if (token.kind !== "identifier") return token;
        if (syntaxKeywords.has(token.text)) return { ...token, className: "fr-syntax-keyword" };
        if (syntaxLiterals.has(token.text)) return { ...token, className: "fr-syntax-literal" };
        if (token === nameToken) return { ...token, className: "fr-syntax-name" };
        if (
          openingParenthesis >= 0 &&
          token.start > openingParenthesis &&
          (closingParenthesis < openingParenthesis || token.start < closingParenthesis)
        ) {
          return { ...token, className: "fr-syntax-parameter" };
        }
        return { ...token, className: "fr-syntax-name" };
      });
    };

    const appendHighlightedSignature = (container, signature) => {
      for (const token of tokenizeSignature(signature)) {
        if (!token.className) {
          container.append(document.createTextNode(token.text));
          continue;
        }
        const span = document.createElement("span");
        span.className = token.className;
        span.textContent = token.text;
        container.append(span);
      }
    };

    const reconcileCollapsedDisclosure = (event) => {
      const disclosure = event.currentTarget;
      if (!(disclosure instanceof HTMLElement) || disclosure.open) return;
      if (!form.hidden && disclosure.contains(form)) {
        disclosure.open = true;
        return;
      }
      const summary = disclosure.querySelector(":scope > summary.fr-node");
      if (
        summary &&
        activeNode &&
        activeNode !== summary &&
        disclosure.contains(activeNode)
      ) {
        setActiveNode(summary);
        summary.focus({ preventScroll: true });
        summary.scrollIntoView({ block: "nearest" });
      }
    };

    const createList = (nodes) => {
      const list = document.createElement("ul");
      list.className = "fr-list";

      for (const node of nodes) {
        const item = document.createElement("li");

        if (node.kind === "folder" || node.kind === "file") {
          item.className = `fr-group fr-${node.kind}`;
          const details = document.createElement("details");
          details.open = true;
          details.addEventListener("toggle", reconcileCollapsedDisclosure);
          const summary = document.createElement("summary");
          summary.className = "fr-tree-row fr-node";
          summary.dataset.nodeId = node.id;
          summary.dataset.annotationLabel = nodeLabel(node);
          summary.dataset.annotationBreadcrumb = node.breadcrumb;
          const label = document.createElement("code");
          label.className = "fr-node-label";
          label.textContent = node.kind === "folder" ? `${node.label}/` : node.label;
          summary.append(label);
          appendNewBadge(summary, node);
          appendTotalCount(summary, node);
          const changes = document.createElement("span");
          changes.className = "fr-change-stats";
          changes.setAttribute("aria-hidden", "true");
          const additions = document.createElement("span");
          additions.className = "fr-change-additions";
          additions.textContent = `+${node.additions}`;
          const deletions = document.createElement("span");
          deletions.className = "fr-change-deletions";
          deletions.textContent = `−${node.deletions}`;
          changes.append(additions, deletions);
          summary.append(changes);
          const divider = document.createElement("span");
          divider.className = "fr-metadata-divider";
          divider.setAttribute("aria-hidden", "true");
          summary.append(divider);
          appendLanguageAndKindTags(summary, node);
          addAnnotationMarker(summary);
          setNodeAccessibleLabel(summary);
          details.append(summary, createList(node.children));
          item.append(details);
        } else {
          item.className = "fr-callable";
          const hasDetails = Boolean(node.details?.length);
          const callableNode = document.createElement(hasDetails ? "summary" : "button");
          if (!hasDetails) callableNode.type = "button";
          callableNode.className = "fr-tree-row fr-node fr-callable-node";
          callableNode.dataset.nodeId = node.id;
          callableNode.dataset.annotationLabel = nodeLabel(node);
          callableNode.dataset.annotationBreadcrumb = node.breadcrumb;
          const signature = document.createElement("code");
          signature.className = "fr-signature";
          appendHighlightedSignature(signature, node.signature);
          callableNode.append(signature);
          appendNewBadge(callableNode, node);
          if (node.returns) {
            const returns = document.createElement("span");
            returns.className = "fr-return";
            const returnArrow = document.createElement("span");
            returnArrow.className = "fr-return-arrow";
            returnArrow.textContent = "→ ";
            returnArrow.setAttribute("aria-hidden", "true");
            const returnType = document.createElement("span");
            returnType.className = "fr-syntax-type";
            returnType.textContent = node.returns;
            returns.append(returnArrow, returnType);
            callableNode.append(returns);
          }
          addAnnotationMarker(callableNode);
          setNodeAccessibleLabel(callableNode);
          if (hasDetails) {
            const disclosure = document.createElement("details");
            disclosure.className = "fr-callable-disclosure";
            disclosure.open = true;
            disclosure.addEventListener("toggle", reconcileCollapsedDisclosure);
            const content = document.createElement("div");
            content.className = "fr-callable-content";
            for (const detail of node.details) appendNote(content, detail);
            disclosure.append(callableNode, content);
            item.append(disclosure);
          } else {
            item.append(callableNode);
          }
        }

        list.append(item);
      }

      return list;
    };

    const isNodeVisible = (element) => {
      let ancestor = element.parentElement;
      while (ancestor && ancestor !== root) {
        if (ancestor.matches("details:not([open])")) {
          const summary = ancestor.querySelector(":scope > summary");
          if (summary !== element && !summary?.contains(element)) return false;
        }
        ancestor = ancestor.parentElement;
      }
      return element.getClientRects().length > 0;
    };

    const visibleNodes = () =>
      Array.from(root.querySelectorAll(".fr-tree-row")).filter(isNodeVisible);

    const moveActiveNode = (offset) => {
      const nodes = visibleNodes();
      if (nodes.length === 0) return;
      const currentIndex = nodes.indexOf(activeNode);
      const nextIndex = Math.min(
        nodes.length - 1,
        Math.max(0, (currentIndex < 0 ? 0 : currentIndex) + offset),
      );
      const nextNode = nodes[nextIndex];
      setActiveNode(nextNode);
      nextNode.focus({ preventScroll: true });
      nextNode.scrollIntoView({ block: "nearest" });
    };

    const updateAnnotationState = (element) => {
      const marker = element.querySelector("[data-annotation-marker]");
      if (marker) marker.hidden = !annotations.has(element.dataset.nodeId);
      setNodeAccessibleLabel(element);
    };

    const buildAnnotationBundle = () => {
      const entries = Array.from(root.querySelectorAll(".fr-node")).flatMap(
        (element) => {
          const annotation = annotations.get(element.dataset.nodeId);
          if (!annotation) return [];
          return [{
            id: element.dataset.nodeId,
            breadcrumb: element.dataset.annotationBreadcrumb,
            annotation,
          }];
        },
      );
      if (entries.length === 0) return { count: 0, text: "" };

      const lines = ["# Functions report annotations", ""];
      entries.forEach((entry, index) => {
        lines.push(`## \`${entry.breadcrumb}\``);
        lines.push("");
        lines.push(`Node ID: \`${entry.id}\``);
        lines.push("");
        lines.push(entry.annotation);
        if (index < entries.length - 1) lines.push("");
      });
      return { count: entries.length, text: lines.join("\n") };
    };

    const conventionalCopy = (text) => {
      const previousFocus = document.activeElement;
      const fallback = document.createElement("textarea");
      fallback.className = "fr-copy-fallback";
      fallback.value = text;
      fallback.setAttribute("aria-hidden", "true");
      root.append(fallback);
      fallback.focus({ preventScroll: true });
      fallback.select();
      let copied = false;
      try {
        copied = typeof document.execCommand === "function" && document.execCommand("copy");
      } catch {
        copied = false;
      }
      fallback.remove();
      if (previousFocus instanceof HTMLElement) {
        previousFocus.focus({ preventScroll: true });
      }
      return copied;
    };

    const copyText = async (text) => {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch {
        // Fall through to the conventional browser copy path.
      }
      return conventionalCopy(text);
    };

    const copyAnnotations = async () => {
      const bundle = buildAnnotationBundle();
      if (bundle.count === 0) {
        copyStatus.textContent = "No annotations to copy.";
        return;
      }

      const copied = await copyText(bundle.text);
      if (copied) {
        copyStatus.textContent = `${bundle.count} annotation${bundle.count === 1 ? "" : "s"} copied.`;
      } else {
        copyStatus.textContent = "Could not access the clipboard. Copy comments manually from the annotation editor.";
      }
    };

    const isEditableTarget = (target) =>
      target instanceof HTMLElement &&
      (target.isContentEditable ||
        target.matches("input, textarea, select") ||
        target.closest("[contenteditable='true']") !== null);

    const resizeAnnotationText = () => {
      const lineSize = 30;
      let contentSize = lineSize;
      if (annotationText.value.length > 0) {
        annotationText.style.blockSize = "0px";
        contentSize = annotationText.scrollHeight;
      }
      const nextSize = Math.min(Math.max(contentSize, lineSize), 240);
      annotationText.style.blockSize = `${nextSize}px`;
      annotationText.style.overflowY = contentSize > 240 ? "auto" : "hidden";
    };

    const openAnnotationEditor = (element) => {
      if (!element) return;
      setActiveNode(element);
      editorNode = element;
      annotationTarget.textContent = element.dataset.annotationLabel || "Report node";
      annotationText.value = annotations.get(element.dataset.nodeId) || "";
      const disclosure = element.matches("summary") ? element.parentElement : null;
      if (disclosure?.matches("details")) disclosure.open = true;
      element.insertAdjacentElement("afterend", form);
      form.hidden = false;
      resizeAnnotationText();
      annotationText.focus();
    };

    const closeAnnotationEditor = () => {
      const returnTarget = editorNode;
      form.hidden = true;
      editorNode = null;
      if (returnTarget) {
        setActiveNode(returnTarget);
        returnTarget.focus({ preventScroll: true });
        returnTarget.scrollIntoView({ block: "nearest" });
      }
    };

    treeTarget.replaceChildren(createList(model.tree));
    const firstNode = visibleNodes()[0];
    if (firstNode) setActiveNode(firstNode);

    root.addEventListener("focusin", (event) => {
      const node = event.target.closest?.(".fr-tree-row");
      if (node && root.contains(node)) setActiveNode(node);
    });

    root.addEventListener("click", (event) => {
      const node = event.target.closest?.(".fr-tree-row");
      if (node && root.contains(node)) {
        setActiveNode(node);
        if (node.dataset.navigationOnly !== undefined) {
          node.focus({ preventScroll: true });
        }
      }
    });

    root.addEventListener("contextmenu", (event) => {
      const node = event.target.closest?.(".fr-node");
      if (!node || !root.contains(node)) return;
      event.preventDefault();
      setActiveNode(node);
      node.focus({ preventScroll: true });
      openAnnotationEditor(node);
    });

    root.addEventListener("keydown", (event) => {
      if (!form.hidden && form.contains(event.target)) return;
      if (isEditableTarget(event.target)) return;
      if (
        treeTarget.contains(event.target) &&
        (event.key === "c" || event.key === "C") &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.altKey
      ) {
        event.preventDefault();
        void copyAnnotations();
        return;
      }
      const node = event.target.closest?.(".fr-tree-row");
      if (!node || !root.contains(node)) return;
      setActiveNode(node);

      if (event.key === "ArrowDown") {
        event.preventDefault();
        moveActiveNode(1);
        return;
      }
      if (event.key === "ArrowUp") {
        event.preventDefault();
        moveActiveNode(-1);
        return;
      }
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        const details = node.matches("summary") ? node.parentElement : null;
        if (details?.open) {
          details.open = false;
        }
        return;
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        const details = node.matches("summary") ? node.parentElement : null;
        if (details && !details.open) {
          details.open = true;
        }
        return;
      }
      if (
        node.matches(".fr-node") &&
        (event.key === "Enter" || event.key === "Return")
      ) {
        event.preventDefault();
        event.stopPropagation();
        openAnnotationEditor(node);
      }
    });

    copyButton.addEventListener("click", () => {
      void copyAnnotations();
    });

    const saveAnnotation = () => {
      const targetNode = editorNode || activeNode;
      const nodeId = targetNode?.dataset.nodeId;
      if (!targetNode || !nodeId) return;
      if (annotationText.value.trim().length === 0) {
        annotations.delete(nodeId);
      } else {
        annotations.set(nodeId, annotationText.value);
      }
      updateAnnotationState(targetNode);
      closeAnnotationEditor();
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      saveAnnotation();
    });

    cancelButton.addEventListener("click", closeAnnotationEditor);
    saveButton.addEventListener("click", saveAnnotation);
    annotationText.addEventListener("input", resizeAnnotationText);

    form.addEventListener("keydown", (event) => {
      if (
        event.metaKey &&
        (event.key === "Enter" || event.key === "Return")
      ) {
        event.preventDefault();
        saveAnnotation();
        return;
      }
      if (event.key === "Escape") {
        event.preventDefault();
        closeAnnotationEditor();
      }
    });
  })();
</script>

</body>
</html>
